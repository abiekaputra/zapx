name: zapx

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${ZAPX_POSTGRES_DB:-zapx}
      POSTGRES_PASSWORD: ${ZAPX_POSTGRES_PASSWORD:-local-zapx-password}
      POSTGRES_USER: ${ZAPX_POSTGRES_USER:-zapx}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${ZAPX_POSTGRES_PORT:-5434}:5432'
    restart: unless-stopped
    volumes:
      - zapx-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.8.3-alpine
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${ZAPX_REDIS_PORT:-6381}:6379'
    restart: unless-stopped
    volumes:
      - zapx-redis:/data

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '${ZAPX_MAILPIT_SMTP_PORT:-1026}:1025'
      - '${ZAPX_MAILPIT_UI_PORT:-8026}:8025'
    restart: unless-stopped
    volumes:
      - zapx-mailpit:/data

volumes:
  zapx-mailpit:
  zapx-postgres:
  zapx-redis:
