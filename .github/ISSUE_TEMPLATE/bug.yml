name: Bug report
description: Report reproducible behavior that differs from the documented result.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, personal data, or private endpoints.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the relevant error output?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that consistently reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 24.15.0, pnpm 11.1.2
    validations:
      required: true
