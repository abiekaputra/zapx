name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zapx_test
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1026
      WEBHOOK_ALLOWED_HOSTS: 127.0.0.1,localhost
      WEBHOOK_RECEIVER_URL: http://127.0.0.1:4010/deliveries
      WEBHOOK_SIGNING_SECRET: local-webhook-secret
      ZAPX_MASTER_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: zapx_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zapx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1026:1025
          - 8026:8025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm quality

      - name: Test PostgreSQL migrations and repositories
        run: pnpm test:integration

      - name: Prepare browser validation data
        run: pnpm db:migrate && pnpm db:seed

      - name: Validate end-user browser flow
        run: pnpm test:e2e

      - name: Upload browser portfolio evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: zapx-browser-evidence
          path: test-results/screenshots
          retention-days: 7

      - name: Validate local infrastructure
        run: docker compose config --quiet
